workflows:
  ios-release:
    name: iOS Release

    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter Pub Get
        script: flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod install

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa